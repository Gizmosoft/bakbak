# Application configuration
spring.application.name=bakbak

# JPA Safety Configurations
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT configuration
jwt.secret=${JWT_SECRET}
# 7 days
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Hibernate configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS (overridden per profile in application-dev / application-prod)
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept
app.cors.max-age=3600

# Outbox TTL for offline message delivery (days)
bakbak.outbox.ttl-days=30

# S3-compatible object storage (MinIO / R2 / AWS S3)
bakbak.storage.endpoint=${S3_ENDPOINT}
bakbak.storage.region=${S3_REGION:us-east-1}
bakbak.storage.access-key=${S3_ACCESS_KEY}
bakbak.storage.secret-key=${S3_SECRET_KEY}
bakbak.storage.bucket=${S3_BUCKET:gup-media}
bakbak.storage.presign-upload-ttl-minutes=15
bakbak.storage.presign-download-ttl-minutes=15
bakbak.storage.max-size-bytes=26214400
bakbak.storage.allowed-mime-types=image/jpeg,image/png,image/gif,image/webp,video/mp4,video/quicktime,audio/mpeg,audio/mp4,audio/ogg,application/pdf
bakbak.storage.pending-ttl-hours=24