# Database — set DB_URL, DB_USER, DB_PASS in your environment (e.g. source .env)
# Prefer DB_URL with ?sslmode=disable for local SSH tunnels (avoids SSL handshake hangs).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Hikari — fail fast and recycle stale connections (tunnels / idle Postgres)
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000

# JWT — must be >= 32 bytes (256 bits) for HS256 in JwtUtil; set JWT_SECRET in .env
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# CORS — Expo / React Native web + emulators + LAN devices hitting local API
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*,http://10.0.0.*:*,http://192.168.*.*:*,http://172.*.*.*:*
