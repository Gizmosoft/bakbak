# Database — set DB_URL, DB_USER, DB_PASS in your environment (e.g. source .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JWT — must be >= 32 bytes (256 bits) for HS256 in JwtUtil; set JWT_SECRET in .env
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# CORS — Expo / React Native web + emulators hitting local API (comma-separated patterns)
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*