spring.application.name=bakbak

# Tests should never use the dev DB.
# Point to a dedicated local test database (create it once: `createdb bakbak_test`).
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USER}
spring.datasource.password=${TEST_DB_PASS}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Keep tests self-contained if something reads JWT config.
# Must be >= 32 bytes (256 bits) for HS256 in JwtUtil.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# Dummy S3 config for tests that load the full application context.
bakbak.storage.endpoint=http://localhost:9000
bakbak.storage.region=us-east-1
bakbak.storage.access-key=test-access-key
bakbak.storage.secret-key=test-secret-key
bakbak.storage.bucket=test-bucket
